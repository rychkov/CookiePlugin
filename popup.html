<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 500px;
      padding: 15px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    .rule {
      border: 1px solid #ddd;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 4px;
      background: #f9f9f9;
    }
    .rule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .rule-name {
      font-weight: bold;
      flex: 1;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 6px;
      margin: 5px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    button {
      padding: 6px 12px;
      margin: 5px 5px 5px 0;
      cursor: pointer;
      border: none;
      border-radius: 3px;
      background: #4CAF50;
      color: white;
    }
    button:hover {
      background: #45a049;
    }
    .btn-delete {
      background: #f44336;
    }
    .btn-delete:hover {
      background: #da190b;
    }
    .btn-secondary {
      background: #2196F3;
    }
    .btn-secondary:hover {
      background: #0b7dda;
    }
    .cookie-item {
      background: white;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #e0e0e0;
      border-radius: 3px;
    }
    label {
      display: block;
      margin: 5px 0 2px 0;
      font-size: 12px;
      color: #666;
    }
    .small-input {
      width: auto;
      min-width: 100px;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 3px;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
  </style>
</head>
<body>
  <h2>Cookie Injector Configuration</h2>
  <div id="status" class="status"></div>
  <div id="rules-container"></div>
  <button id="add-rule" class="btn-secondary">+ Add New Rule</button>
  <button id="save">Save Configuration</button>
  
  <script src="popup.js"></script>
</body>
</html>
